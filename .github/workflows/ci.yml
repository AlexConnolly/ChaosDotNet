name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: |
          set -o pipefail
          dotnet test --solution ChaosDotNet.slnx --no-build --configuration Release 2>&1 | tee test.log

      - name: Report failed tests
        if: failure()
        run: grep -E -A12 '^\s*failed ' test.log | head -200 | sed 's/^/::error::/' || true

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
